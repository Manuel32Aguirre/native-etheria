services:
  postgres:
    image: postgres:16-alpine
    container_name: native_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-native_db}
      POSTGRES_USER: ${DB_USERNAME:-native_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-native_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - native_pg_data:/var/lib/postgresql/data
    networks:
      - native_network

volumes:
  native_pg_data:

networks:
  native_network:
    driver: bridge
