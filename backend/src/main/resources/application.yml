spring:
  application:
    name: native

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:native_db}
    username: ${DB_USERNAME:native_user}
    password: ${DB_PASSWORD:native_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Bind to all network interfaces so devices on the local network (e.g. the
# Flutter app running on a phone) can reach this backend via the host's LAN IP.
server:
  address: 0.0.0.0
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-base64-secret-string-please}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  review:
    # Ebbinghaus-style interval progression (in minutes), applied strictly in order.
    interval-minutes: 180,720,1440,4320,10080,20160,43200
    block-size: 5
    required-correct-repetitions: 20

  mail:
    from: ${MAIL_FROM:}
    verification-base-url: ${MAIL_VERIFICATION_BASE_URL:http://3.21.152.118:8080/api/auth/verify}

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: https://api.openai.com/v1
  vision-model: ${OPENAI_VISION_MODEL:gpt-4o}
  stt-model: ${OPENAI_STT_MODEL:whisper-1}
  tts-model: ${OPENAI_TTS_MODEL:tts-1}
  tts-voice: ${OPENAI_TTS_VOICE:alloy}

# Speech-to-text for practice answers.
# local  = stt-service (faster-whisper on the same Lightsail host) — $0 per attempt
# openai = OpenAI Whisper — billed per request
stt:
  provider: ${STT_PROVIDER:local}
  local-base-url: ${STT_LOCAL_URL:http://localhost:9000}
  language: ${STT_LANGUAGE:en}

logging:
  level:
    com.example.demo: INFO
