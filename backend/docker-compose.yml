services:
  native:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: native_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      STT_PROVIDER: ${STT_PROVIDER:-local}
      STT_LOCAL_URL: ${STT_LOCAL_URL:-http://stt:9000}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      stt:
        condition: service_started
    networks:
      - native_network

  stt:
    build:
      context: ../stt-service
      dockerfile: Dockerfile
    container_name: native_stt
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_DEVICE: cpu
      WHISPER_LANGUAGE: ${STT_LANGUAGE:-en}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-1}
      OMP_NUM_THREADS: ${WHISPER_CPU_THREADS:-1}
    # Keep this low for Lightsail $7. Raise only if the instance has free RAM.
    mem_limit: 450m
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - native_stt_models:/root/.cache/huggingface
    networks:
      - native_network

  postgres:
    image: postgres:16-alpine
    container_name: native_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-native_db}
      POSTGRES_USER: ${DB_USERNAME:-native_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-native_password}
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USERNAME:-native_user} -d $${DB_NAME:-native_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - native_pg_data:/var/lib/postgresql/data
    networks:
      - native_network

volumes:
  native_pg_data:
  native_stt_models:

networks:
  native_network:
    driver: bridge
