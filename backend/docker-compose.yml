version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: native_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-native_db}
      POSTGRES_USER: ${DB_USERNAME:-native_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-native_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - native_pg_data:/var/lib/postgresql/data
    networks:
      - native_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: native_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@native.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres
    networks:
      - native_network

volumes:
  native_pg_data:

networks:
  native_network:
    driver: bridge
